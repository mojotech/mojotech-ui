name: Build and Deploy

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.16

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy npm config
        run: cp .npmrc.ci .npmrc

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: v1-dependencies-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: ./node_modules
          key: v1-dependencies-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Persist to workspace
        uses: actions/upload-artifact@v4
        with:
          name: mojotech-ui
          path: .

  ensure_version_bump:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.16
    needs: build
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Attach workspace
        uses: actions/download-artifact@v4
        with:
          name: mojotech-ui
          path: .

      - name: Ensure version bump
        run: |
          ./scripts/npm_version_check.sh

  publish:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.16
    needs: ensure_version_bump
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Attach workspace
        uses: actions/download-artifact@v4
        with:
          name: mojotech-ui
          path: .

      - name: Publish updated NPM package
        run: |
          npm publish
